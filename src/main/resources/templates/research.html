<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" class="no-js">
<head>
  <meta charset="UTF-8"/><title th:text="${#locale.language == 'vi' ? 'Nghiên cứu · Market Radar' : 'Research · Market Radar'}">Research · Market Radar</title>
  <link rel="stylesheet" href="/css/fonts.css"/><link rel="stylesheet" href="/css/colors.css"/>
  <link rel="stylesheet" href="/css/typography.css"/><link rel="stylesheet" href="/css/spacing.css"/>
  <link rel="stylesheet" href="/css/base.css"/><link rel="stylesheet" href="/css/patterns.css"/>
  <link rel="stylesheet" href="/css/ops-components.css"/><link rel="stylesheet" href="/css/ops-sidebar.css"/>
  <style>
    .mode-tabs { display:flex; gap:8px; margin-bottom:18px; }
    .mode-tab { padding:10px 18px; border-radius:999px; border:1px solid var(--border-default); background:var(--surface-card);
      color:var(--text-secondary); font-weight:600; font-size:var(--text-sm); cursor:pointer; }
    .mode-tab.active { background:var(--brand-red-500,#d7192d); color:#fff; border-color:transparent; }
    .no-js .mode-tab { display:none; }
    .mode-panel { display:none; }
    .mode-panel.active { display:block; }
    .no-js .mode-panel { display:block !important; border-top:2px solid var(--border-default); padding-top:22px; margin-top:22px; }
    .no-js .mode-panel:first-of-type { border-top:0; padding-top:0; margin-top:0; }
    .research-card { max-width:760px; padding:26px; border:1px solid var(--border-default); border-radius:var(--radius-lg); background:var(--surface-card); margin-bottom:20px; }
    .research-card h2 { margin:0 0 8px; font-size:var(--text-xl); } .research-card p { color:var(--text-secondary); line-height:1.55; }
    .research-control { margin:18px 0 14px; } .research-control textarea.ops-input { min-height:100px; font-family:inherit; resize:vertical; }
    .notice { padding:14px 16px; border-radius:var(--radius-md); margin:0 0 18px; }
    .notice.err { background:var(--rose-50); color:var(--rose-700); }
    .how-it-works { margin-top:22px; padding:14px 16px; background:var(--slate-50); border-left:3px solid var(--brand-red-500); color:var(--text-secondary); font-size:var(--text-sm); line-height:1.6; }
    .how-it-works ol { margin:8px 0 0; padding-left:20px; }
    .activity-feed { display:none; margin-top:16px; padding:14px 16px; background:var(--slate-50); border-radius:var(--radius-md); font-size:var(--text-sm); }
    .activity-feed.live { display:block; }
    .activity-feed ul { margin:0; padding-left:18px; }
    .activity-feed li { margin:4px 0; color:var(--text-secondary); }
    .activity-feed li.latest { color:var(--text-primary); font-weight:600; }
    .search-item { padding:14px 0; border-top:1px solid var(--border-default); }
    .search-item:first-child { border-top:0; }
    .search-item h4 { margin:0 0 4px; font-size:var(--text-md); }
    .search-item p { margin:4px 0 0; color:var(--text-secondary); font-size:var(--text-sm); line-height:1.5; }
    .search-item .meta { font-size:var(--text-xs); color:var(--text-tertiary); }
  </style>
</head>
<body><div class="ops-shell">
  <th:block th:replace="~{fragments/ops-sidebar :: sidebar('research', ${null})}"></th:block>
  <div class="ops-main"><div class="ops-content">
    <div class="page-header"><div>
      <h1 th:text="${#locale.language == 'vi' ? 'Nghiên cứu' : 'Research'}">Research</h1>
      <p th:text="${#locale.language == 'vi' ? 'Hai chế độ tách bạch: tìm nhanh 1 lượt, hoặc để AI tự lặp nhiều vòng điều tra sâu. Cả hai không ghi vào kho evidence chính thức.' : 'Two distinct modes: a quick single-pass search, or let AI iterate over several rounds for deep investigation. Neither writes to the official evidence store.'}">Description</p>
    </div></div>

    <div class="mode-tabs">
      <button type="button" class="mode-tab active" data-target="quick" th:text="${#locale.language == 'vi' ? 'Tìm kiếm nhanh' : 'Quick Search'}">Quick Search</button>
      <button type="button" class="mode-tab" data-target="deep" th:text="${#locale.language == 'vi' ? 'Deep Research' : 'Deep Research'}">Deep Research</button>
    </div>

    <!-- ═══════ QUICK WEB SEARCH ═══════ -->
    <section class="mode-panel active" data-mode="quick">
      <p class="notice err" th:if="${searchError}" th:text="${searchError}">Error.</p>
      <section class="research-card">
        <h2 th:text="${#locale.language == 'vi' ? 'Tìm kiếm nhanh' : 'Quick Search'}">Quick Search</h2>
        <p th:text="${#locale.language == 'vi' ? '1 lượt tìm + đọc top kết quả, KHÔNG có AI tổng hợp — nhanh, xác định, phù hợp câu hỏi đơn giản kiểu &quot;có tin gì về X&quot;.' : 'One search+read pass, NO AI synthesis — fast and deterministic, good for a simple &quot;what news on X&quot; question.'}">Description</p>
        <form method="post" action="/research/search">
          <div class="research-control">
            <label class="lbl" for="q" th:text="${#locale.language == 'vi' ? 'Câu hỏi / từ khoá' : 'Question / keyword'}">Question / keyword</label>
            <input id="q" class="ops-input" name="q" type="text" required autofocus/>
          </div>
          <button class="btn btn-primary" type="submit" th:text="${#locale.language == 'vi' ? 'Tìm kiếm' : 'Search'}">Search</button>
        </form>
      </section>

      <section class="research-card" th:if="${searchResult != null}">
        <h2 th:text="${#locale.language == 'vi' ? 'Kết quả cho: ' : 'Results for: '} + ${searchResult.query}">Results</h2>
        <div class="empty-state" th:if="${searchResult.items.isEmpty()}">
          <div class="title" th:text="${#locale.language == 'vi' ? 'Không tìm được kết quả nào.' : 'No results found.'}">No results</div>
        </div>
        <div class="search-item" th:each="item : ${searchResult.items}">
          <h4>
            <a th:if="${item.url != null}" th:href="${item.url}" target="_blank" th:text="${item.title}">Title</a>
            <span th:unless="${item.url != null}" th:text="${item.title}">Title</span>
          </h4>
          <p th:if="${item.excerpt != null}" th:text="${item.excerpt}">Excerpt</p>
          <p class="meta" th:if="${item.note != null}" th:text="${item.note}">Note</p>
        </div>
      </section>
    </section>

    <!-- ═══════ DEEP RESEARCH ═══════ -->
    <section class="mode-panel" data-mode="deep">
      <p class="notice err" th:if="${promptError}" th:text="${promptError}">Error.</p>
      <section class="research-card">
        <h2 th:text="${#locale.language == 'vi' ? 'Deep Research' : 'Deep Research'}">Deep Research</h2>
        <p th:text="${#locale.language == 'vi' ? 'AI tự lặp nhiều vòng: quyết định tìm kiếm mở hay đọc 1 URL cụ thể qua trình duyệt thật (không giới hạn trong danh sách nguồn whitelist), tự dừng khi đủ thông tin. Mỗi nguồn thật tìm được vừa được tổng hợp nhanh thành báo cáo xem ngay, VỪA được nạp riêng vào pipeline xác thực đầy đủ (Router → Researcher → Analyst → Fact-checker → Verifier) — chờ duyệt ở Reviewer Queue trước khi vào báo cáo BI chính thức.' : 'AI iterates over multiple rounds: deciding to search openly or render a specific URL with a real browser (not limited to the whitelisted source list), stopping on its own once satisfied. Every real source found is both synthesized instantly into a preview report AND separately fed into the full verification pipeline (Router → Researcher → Analyst → Fact-checker → Verifier) — held in the Reviewer Queue before it can reach the official BI report.'}">Description</p>
        <form method="post" action="/research/deep" id="deep-form">
          <div class="research-control">
            <label class="lbl" for="prompt" th:text="${#locale.language == 'vi' ? 'Yêu cầu nghiên cứu' : 'Research request'}">Research request</label>
            <textarea id="prompt" class="ops-input" name="prompt" required></textarea>
          </div>
          <button class="btn btn-primary" type="submit" id="deep-submit" th:text="${#locale.language == 'vi' ? 'Chạy Deep Research' : 'Run Deep Research'}">Run Deep Research</button>
        </form>
        <div class="activity-feed" id="activity-feed"><ul id="activity-list"></ul></div>
        <div class="how-it-works">
          <strong th:text="${#locale.language == 'vi' ? 'Cách hoạt động' : 'How it works'}">How it works</strong>
          <ol>
            <li th:text="${#locale.language == 'vi' ? 'Tối đa 5 vòng lặp, tối đa 8 nguồn — AI tự dừng sớm nếu đã đủ thông tin.' : 'Up to 5 iterations, up to 8 sources — the AI stops early once it has enough.'}">step</li>
            <li th:text="${#locale.language == 'vi' ? 'Kết quả hiển thị NGAY theo template Business Intelligence Report (Meridian) — có nút tải PDF/.docx. Bản này do AI tự tổng hợp, CHƯA qua fact-check.' : 'The result renders immediately as a Business Intelligence Report (Meridian template) — with PDF/.docx download buttons. This preview is AI-synthesized and has not been fact-checked yet.'}">step</li>
            <li th:text="${#locale.language == 'vi' ? 'Song song, mỗi nguồn thật đã đọc được cũng được nạp vào kho evidence và chạy qua đúng pipeline xác thực (Gate L1 exact-match + Gate L2 verifier độc lập) — xem tiến trình ở Reviewer Queue / Pipeline Runner.' : 'In parallel, every real source read is also ingested into the evidence store and run through the same verification pipeline (Gate L1 exact-match + Gate L2 independent verifier) — track progress in the Reviewer Queue / Pipeline Runner.'}">step</li>
          </ol>
        </div>
      </section>
    </section>
  </div></div>
</div>
<script src="/js/ops-session.js"></script><script src="/js/ops-sidebar.js"></script>
<script>
  document.documentElement.classList.remove('no-js');

  var tabs = document.querySelectorAll('.mode-tab');
  var panels = document.querySelectorAll('.mode-panel');
  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      tabs.forEach(function (t) { t.classList.remove('active'); });
      panels.forEach(function (p) { p.classList.remove('active'); });
      tab.classList.add('active');
      document.querySelector('.mode-panel[data-mode="' + tab.dataset.target + '"]').classList.add('active');
    });
  });

  if (window.EventSource) {
    var form = document.getElementById('deep-form');
    var submitBtn = document.getElementById('deep-submit');
    var feed = document.getElementById('activity-feed');
    var list = document.getElementById('activity-list');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var prompt = document.getElementById('prompt').value.trim();
      if (!prompt) return;
      list.innerHTML = '';
      feed.classList.add('live');
      submitBtn.disabled = true;
      var es = new EventSource('/research/deep/stream?prompt=' + encodeURIComponent(prompt));
      es.addEventListener('step', function (ev) {
        document.querySelectorAll('#activity-list li').forEach(function (li) { li.classList.remove('latest'); });
        var li = document.createElement('li');
        li.className = 'latest';
        li.textContent = ev.data;
        list.appendChild(li);
      });
      es.addEventListener('done', function (ev) {
        es.close();
        window.location = '/research/deep/view/' + ev.data;
      });
      es.addEventListener('error', function (ev) {
        es.close();
        submitBtn.disabled = false;
        var li = document.createElement('li');
        li.textContent = 'LỖI: ' + (ev.data || 'kết nối gián đoạn');
        list.appendChild(li);
      });
    });
  }
</script>
</body></html>
