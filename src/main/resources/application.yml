# Mặc định 8081 (không phải 8080 mặc định của Spring Boot) — cố định ở đây thay vì dựa vào
# việc phải nhớ `export SERVER_PORT=8081` mỗi lần mở terminal mới trước khi chạy app (đã gây
# nhầm lẫn nhiều lần: quên export -> app rơi về 8080, trong khi mọi hướng dẫn/script đều giả
# định 8081). Vẫn đọc được biến môi trường SERVER_PORT nếu thật sự cần đổi cổng.
server:
  port: ${SERVER_PORT:8081}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    # File-backed (đổi từ in-mem 2026-07-12): restart KHÔNG mất dữ liệu nữa — raw docs,
    # classification, LlmCallLog (replay-cache) đều giữ lại. Demo chạy lại pipeline
    # = replay từ cache, KHÔNG tốn API call, không cần mạng. Backup = copy thư mục ./data.
    # One Market Radar process owns the file. AUTO_SERVER is deliberately disabled:
    # in an executable Spring Boot jar H2 can leave a stale remote-server lock after
    # shutdown, making the next launch connect to a dead IP/port instead of the file.
    url: jdbc:h2:file:./data/marketradar;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true   # /h2-console — chỉ dùng dev/demo, tắt khi deploy thật

marketradar:
  # Demo Strategy: true = sidebar thu gọn về luồng 5 bước (nguồn chọn lọc → duyệt →
  # báo cáo → research), ẩn trang vận hành/audit kỹ thuật khỏi menu (route vẫn sống).
  # Các phòng ban khác dùng đầy đủ: để false.
  demo-mode: false
  legacy-desks:
    # 2026-08-03 (feedback CFO Strategy: chỉ cần #3 web-search/HTTP + #5 manual import,
    # dồn lực vào curate/validate — không cần "wider net"): nhánh Product/Sales/Compliance
    # (Classifier routing → Desk feed → Product Brief magazine, Special Issues) không còn
    # ai dùng. KHÁC demo-mode (chỉ ẩn menu, route vẫn sống) — cờ này 404 hẳn route
    # /desks, /report/product*, /product/special-issues*, /report/weekly*, và ẩn luôn
    # nút "Generate reports" (Publish/Product SME) khỏi Pipeline Runner. KHÔNG xoá code:
    # đặt lại true là dùng được ngay, không cần rebuild gì thêm.
    enabled: false
  ingest:
    enabled: false          # bật true khi muốn cron chạy thật; demo dùng nút chạy tay /ingest/run
    fixed-delay-ms: 900000  # 15 phút
    max-items-per-source: 25  # cap tin mới nhất mỗi nguồn mỗi lần chạy — chặn feed dump nguyên archive
                              # (FSC_TW ~800 item) làm phình chi phí classify + cặp dedup O(n²)
  llm:
    # Writer (AI#2 extractor + AI#3 interpreter + dedup pairwise).
    # Batch 9 — hai đường, chọn bằng config:
    #   base-url RỖNG  → Anthropic Messages API, key từ env ANTHROPIC_API_KEY (đường cũ)
    #   base-url ĐƯỢC SET → endpoint OpenAI-compat, key từ env WRITER_API_KEY
    #     Gemini:  base-url=https://generativelanguage.googleapis.com/v1beta/openai  model=gemini-2.5-flash
    # KHÔNG hardcode key vào file này.
    # 2026-07-15 (audit chất lượng — quyết định Hanh): writer chạy họ ChatGPT, KHÔNG Claude
    # (ngân sách). Nâng gpt-4o-mini → gpt-5-mini: thông minh hơn hẳn mà vẫn rẻ
    # ($0.25/$2 mỗi 1M token). Cần env WRITER_API_KEY (OpenAI key). Client tự chuyển
    # max_completion_tokens/reasoning_effort cho họ gpt-5 (xem OpenAiCompatibleLlmClient).
    base-url: https://api.openai.com/v1
    model: gpt-5-mini
    # Fix 2026-07-13: 1024 (batch 3, tune cho 1 câu interpreter) quá thấp cho AI#2 extractor
    # (batch 8, thêm sau) — 1 doc có thể sinh tới 5 fact, mỗi fact có span+company+product+
    # date+2 summary → response bị CẮT GIỮA CHỪNG (JSON dở dang) → 100% SCHEMA_REJECTED.
    # Nâng lên mức đủ dư — max_tokens chỉ là TRẦN, không ép model sinh hết mức, không tốn
    # thêm tiền nếu model không cần dùng tới (giá tính theo token THỰC SINH ra).
    # 2026-07-15: 4096 → 8192 — với họ gpt-5, max_completion_tokens bao gồm CẢ reasoning
    # token ẩn; extract 8 fact (span dài) + reasoning cần trần dư dả hơn. Vẫn chỉ là TRẦN.
    max-tokens: 8192
    temperature: 1.0              # cần đa dạng cho self-consistency; để trống nếu model từ chối
    samples: 3                    # N lần gọi độc lập
    min-votes: 2                  # nhãn nhận khi đạt >= 2/3 vote (ngưỡng bảo thủ cố định)
    replay-cache: true            # đọc lại response đã log — fallback "API lỗi giữa demo"
  classifier:                      # AI#1 — bean riêng, mặc định RỖNG = dùng lại writer ở trên (không đổi hành vi cũ)
    # Đây là stage tốn LLM call nhiều nhất khi crawl volume tăng (3x self-consistency/doc) —
    # đổi sang provider rẻ hơn TẠI ĐÂY, không cần sửa code. API key đọc từ env CLASSIFIER_API_KEY.
    # Gợi ý: Qwen-Flash (base-url=https://dashscope-intl.aliyuncs.com/compatible-mode/v1, model=qwen-flash)
    #    hoặc DeepSeek V4 Flash (base-url=https://api.deepseek.com, model=deepseek-chat)
    base-url: ""
    model: ""
    # Batch 9: đường Claude native lúc boot (đối xứng với writer) — set model ở đây + env
    # ANTHROPIC_API_KEY để dùng Claude cho classifier ngay từ khi khởi động, không cần vào
    # /llm-settings trước. Không bắt buộc — /llm-settings vẫn đổi được runtime dù để rỗng.
    anthropic-model: ""
    max-tokens: 200
  verifier:                        # Batch 4 — Gate L2: verifier PHẢI khác họ với writer (Invariant #2)
    # API key đọc từ env VERIFIER_API_KEY — không có key → STUB (mọi thứ vào review, không auto-publish)
    # DeepSeek V4 Flash: rẻ (~$0.14/$0.28 mỗi 1M token), khác họ với writer Anthropic, và OpenAI-compat
    # nên cắm thẳng vào base-url/model dưới đây — thay cho placeholder gpt-4o-mini trước đó.
    base-url: https://api.deepseek.com     # endpoint OpenAI-compat; đổi provider = đổi dòng này
    model: deepseek-chat                    # alias tương thích DeepSeek V4 Flash (soát lại nếu deprecate sau 2026-07-24)
    # Batch 9: đường Claude native lúc boot (đối xứng với writer) — CHỈ hợp lệ khi writer
    # không phải Claude (Invariant2 kiểm tra, app từ chối boot nếu vi phạm). Set model ở đây
    # + env ANTHROPIC_API_KEY nếu muốn verifier là Claude ngay từ khởi động.
    anthropic-model: ""
    max-tokens: 512
  alert:                           # Batch 5 — Hot Alert (bước 8)
    enabled: true
    # Slack incoming webhook đọc từ env SLACK_WEBHOOK_URL — rỗng → STUB mode:
    # không gọi mạng, alert chỉ ghi vào /alerts (demo offline vẫn xem được nội dung)
    webhook-url: ${SLACK_WEBHOOK_URL:}
    min-tier: T3                   # chỉ tin T3-T4 mới "sốt dẻo"
    base-url: http://localhost:8080  # gốc link "hành động" trong alert
  dedup:                           # Batch 5 — Dedup/Conflict (bước 9)
    window-hours: 72               # chỉ so cặp tài liệu trong cửa sổ 72h
    jaccard-same: 0.90             # >= ngưỡng này = overlap tiêu đề cao, vẫn hỏi pairwise; KHÔNG tự xoá
    jaccard-gray: 0.50             # >= gray = candidate pairwise; STUB/parse lỗi → chờ người
    content-duplicate: 0.92        # chỉ nội dung trigram gần như y hệt mới deterministic duplicate
  fetch:
    # One bounded retry improves resilience to temporary connect resets/timeouts;
    # redirects, non-200 responses, unsafe hosts, and body/content gates never retry.
    connect-timeout-seconds: 10
    request-timeout-seconds: 30
    max-transient-retries: 1
    retry-backoff-millis: 400
    max-body-bytes: 5242880   # 5 MB — chống tải payload quá cỡ
    https-only: true          # nguồn http thuần sẽ bị từ chối (fail loud, log rõ)
  browser:                    # Open research — BrowserRenderService (Playwright, render JS thật)
    executable-path: ""       # để trống ở production: Playwright tự quản lý Chromium (cài 1 lần lúc
                               # deploy: java -cp <cp> com.microsoft.playwright.CLI install chromium).
                               # Chỉ set khi môi trường có sẵn Chromium ở đường dẫn riêng.
    headless: true
    timeout-seconds: 20

logging:
  level:
    com.marketradar: INFO
